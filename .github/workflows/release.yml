name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build all architectures
        run: build/build-spk.sh --all --version ${{ steps.v.outputs.version }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.spk
            dist/*.sha256
          generate_release_notes: true
