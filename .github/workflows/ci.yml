name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: |
          shellcheck -x --severity=style \
            install.sh uninstall.sh src/bin/syno-letsencrypt src/lib/*.sh

  bootstrap:
    name: Installer is fetchable and parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.sh as a standalone file
        # The one-liner pipes this into bash with no checkout, so it must be
        # syntactically self-sufficient.
        run: bash -n install.sh
      - name: Refuse to run without root
        run: |
          set +e
          out="$(bash install.sh 2>&1)"
          echo "$out"
          echo "$out" | grep -q "needs root" || { echo "expected a root check"; exit 1; }
